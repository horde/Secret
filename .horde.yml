---
id: Secret
name: Secret
full: Secret key encryption library with authenticated encryption
description: |-
  A library for encrypting and decrypting small pieces of data with modern authenticated encryption (Libsodium XSalsa20-Poly1305, AES-256-GCM) or legacy Blowfish. Provides dual-stack API: PSR-4 modern SecretManager with AEAD support, and PSR-0 Horde_Secret for backward compatibility.
list: dev
type: library
homepage: https://www.horde.org/libraries/Horde_Secret
authors:
  - name: Chuck Hagenbuch
    user: chuck
    email: chuck@horde.org
    active: false
    role: lead
  - name: Michael Slusarz
    user: slusarz
    email: slusarz@horde.org
    active: false
    role: lead
version:
  release: 3.0.0
  api: 3.0.0alpha1
state:
  release: stable
  api: alpha
license:
  identifier: LGPL-2.1-only
  uri: http://www.horde.org/licenses/lgpl21
dependencies:
  required:
    php: ^8.1
    composer:
      horde/crypt_blowfish: ^2
      horde/exception: ^3
    ext:
      hash: '*'
  optional:
    composer:
      horde/test: ^3
    ext:
      sodium: '*'
      openssl: '*'
vendor: horde
keywords:
  - encryption
  - aes
ci-platform:
  '8.1':
    - php: ^7.4 || ^8
    - ext-dom
  '8.2':
    - php: ^7.4 || ^8
    - ext-dom
  '8.3':
    - php: ^7.4 || ^8
    - ext-dom
  '8.4':
    - php: ^7.4 || ^8
    - ext-dom
  '8.5':
    - php: ^7.4 || ^8
    - ext-dom
  '8.6':
    - php: ^7.4 || ^8
    - ext-dom
ci-platform-flags:
  needs_installer_plugin: false
